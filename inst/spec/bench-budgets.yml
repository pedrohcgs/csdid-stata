  bootstrap_medium:
    rows: 25000
    reps: 999
    max_seconds: 180
    max_memory_mb: 2000
    required_default: false
    opt_in: true
    gate: "CSDID_RUN_OPTIN_PERF=1 tests/run-optin-performance.sh"
  large_panel:
    rows: 500000
    max_seconds: 900
    max_memory_mb: 6000
    required_default: false
    opt_in: true
    gate: "CSDID_RUN_OPTIN_PERF=1 tests/run-optin-performance.sh"
  jel_replication:
    max_seconds: 1800
    max_memory_mb: 6000
    required_default: false
    opt_in: true

comparisons:
  r_did:
    required: true
    metric: "numerical parity is binding; runtime is diagnostic"
  python_csdid:
    required: true
    metric: "deeper-test parity is binding where mapped; runtime is diagnostic"
  legacy_stata:
    required: true
    metric: "performance and peak-RSS release certification against the pinned public baseline; legacy numerical behavior is not the statistical oracle"
  optional_fast_paths:
    required: true
    metric: "fast(auto) default must match explicit nofast under EXACT/TOL001/TOL002 where both paths apply; optimized fast paths must cover dr/reg/ipw, covariates, weights, fix_weights, repeated cross sections, allow_unbalanced routing, cluster, bootstrap-smoke, and aggregation rows; large-job performance(auto) default, fast lean, and explicit performance(auto) must preserve ATT(g,t) and aggregation while avoiding large e() matrix materialization"
